<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#100f0f;color:white}iframe{border:0;width:390px;height:2300px;display:block}pre{position:absolute;left:400px;top:0;font:12px monospace;white-space:pre-wrap;width:190px}</style></head><body><iframe src="../orcamento.html" title="Preview mobile"></iframe><pre id="checks">Loading</pre><script>
const frame=document.querySelector('iframe');
frame.addEventListener('load',async()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 await d.fonts.ready;
 setTimeout(()=>{
  const main=d.querySelector('main'), input=d.querySelector('#email'), ring=d.querySelector('.form-current');
  const checks={active:main.classList.contains('energy-active'),motionReduced:w.matchMedia('(prefers-reduced-motion: reduce)').matches,overflow:d.documentElement.scrollWidth>w.innerWidth,path:!!d.querySelector('.energy-bridge path').getAttribute('d'),mask:w.getComputedStyle(ring).maskComposite,animations:d.getAnimations().map(a=>a.animationName).filter(n=>/orbit|current|charge|transfer/.test(n))};
  for(const a of d.getAnimations()){a.pause();a.currentTime=a.animationName==='finger-charge'||a.animationName==='finger-ring'?300:a.animationName==='energy-transfer'?650:a.animationName==='form-orbit'?1600:4000;}
  document.querySelector('#checks').textContent=JSON.stringify(checks,null,2);
 },200);
});
</script></body></html>
