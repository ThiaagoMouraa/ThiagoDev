<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>body{margin:0;background:#100f0f;color:#fff}iframe{width:1440px;height:1600px;border:0;display:block}pre{font:11px monospace;white-space:pre-wrap}</style></head><body><iframe src="../projetos.html" title="Revisao de projetos"></iframe><pre id="checks">Carregando</pre><script>
const frame=document.querySelector('iframe');frame.addEventListener('load',async()=>{const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;setTimeout(()=>{const intro=d.querySelector('.projects-intro'),particles=d.querySelector('.title-particles'),card=d.querySelector('.project-card');card.focus({preventScroll:true});const checks={width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,particles:d.querySelectorAll('.title-particles span').length,particlesContained:particles.getBoundingClientRect().bottom<=intro.getBoundingClientRect().bottom,cardBelowParticles:card.getBoundingClientRect().top>particles.getBoundingClientRect().bottom,neonKeyboard:w.getComputedStyle(card,'::before').opacity,projectLink:d.querySelector('[aria-current]').getAttribute('href')};for(const a of d.getAnimations()){a.pause();a.currentTime=2100;}checks.neonKeyboard=w.getComputedStyle(card,'::before').opacity;document.querySelector('#checks').textContent=JSON.stringify(checks);},700);});</script></body></html>
