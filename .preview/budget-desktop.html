<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#100f0f;color:white}iframe{border:0;width:1440px;height:1900px;display:block}pre{font:12px monospace;white-space:pre-wrap}</style></head><body><iframe src="../orcamento.html"></iframe><pre id="checks">Loading</pre><script>
const frame=document.querySelector('iframe');frame.addEventListener('load',async()=>{const w=frame.contentWindow,d=frame.contentDocument;await d.fonts.ready;setTimeout(()=>{const scene=d.querySelector('.robot-scene'),footer=d.querySelector('.footer');const checks={width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,path:d.querySelector('.panel-energy path').getAttribute('d'),topSpace:w.getComputedStyle(scene).marginTop,bottomSpace:w.getComputedStyle(footer).marginTop,fields:d.querySelectorAll('.field-control').length,handGlow:w.getComputedStyle(d.querySelector('.hand-neon')).filter,fieldDelays:[...d.querySelectorAll('.form-field')].map(f=>f.style.getPropertyValue('--field-delay')),oldBridge:!!d.querySelector('.energy-bridge'),requiredValid:d.querySelector('form').checkValidity()};for(const a of d.getAnimations()){a.pause();a.currentTime=/finger/.test(a.animationName)?1000:2500;}document.querySelector('#checks').textContent=JSON.stringify(checks);},500);});</script></body></html>
